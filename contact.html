<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Deepesh Shrestha</title>

    <link rel="stylesheet" href="contact.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<header>

    <div class="logo">
        Deepesh<span>.</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#about">About</a>
        <a href="index.html#skills">Skills</a>
        <a href="index.html#projects">Projects</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>

</header>

<section class="contact">

    <h1>Contact Me</h1>

    <div class="container">

        <!-- Contact Details -->

        <div class="contact-info">

            <h2>Get In Touch</h2>

            <p>
                Feel free to contact me for project collaboration,
                teaching, web development, or any questions.
            </p>

            <div class="info">
                <i class="fas fa-user"></i>
                <span>Deepesh Shrestha</span>
            </div>

            <div class="info">
                <i class="fas fa-envelope"></i>
                <span>deepesh@example.com</span>
            </div>

            <div class="info">
                <i class="fas fa-phone"></i>
                <span>+977-98XXXXXXXX</span>
            </div>

            <div class="info">
                <i class="fas fa-location-dot"></i>
                <span>Kathmandu, Nepal</span>
            </div>

            <div class="social">

                <a href="#"><i class="fab fa-facebook-f"></i></a>

                <a href="#"><i class="fab fa-instagram"></i></a>

                <a href="#"><i class="fab fa-linkedin-in"></i></a>

                <a href="#"><i class="fab fa-github"></i></a>

            </div>

        </div>

        <!-- Contact Form -->

        <div class="contact-form">

            <form>

                <input type="text" placeholder="Full Name" required>

                <input type="email" placeholder="Email Address" required>

                <input type="text" placeholder="Subject">

                <textarea rows="6" placeholder="Your Message"></textarea>

                <button type="submit">Send Message</button>

            </form>

        </div>

    </div>

</section>

<!-- Google Map -->

<section class="map">

<iframe
src="https://www.google.com/maps?q=Kathmandu,Nepal&output=embed"
allowfullscreen=""
loading="lazy">
</iframe>

</section>

<footer>

<p>© 2026 Deepesh Shrestha | All Rights Reserved.</p>

</footer>

</body>
</html>
